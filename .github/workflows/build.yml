name: Build Flet APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build APK
        uses: flet-dev/action-build@v1
        with:
          platform: apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apparelory-APK
          path: build/apk/**/*.apk
